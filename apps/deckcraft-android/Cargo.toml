[package]
name = "deckcraft-android"
description = "DeckCraft as an Android app (runs on Android phones/tablets and ChromeOS)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Built with `cargo ndk` into android/app/src/main/jniLibs, then packaged by Gradle (android/),
# which adds the Java activity that reaches the user's folders. Not under the workspace lints:
# talking to Java (JNI) and the NativeActivity entry point need `unsafe`.
[lib]
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
deckcraft-engine = { workspace = true }
deckcraft-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "android-native-activity"] }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
android_logger = "0.15"
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
jni = "0.21"
ndk-context = "0.1"
