plugins { id "com.android.application" }

android {
    namespace "ai.storyteller.deckcraft"
    compileSdk 34
    defaultConfig {
        applicationId "ai.storyteller.deckcraft"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "0.19.1-android"
        ndk { abiFilters "arm64-v8a", "x86_64" }
    }
    // The fixed key from the build's secrets; without it, Gradle's own debug key.
    signingConfigs {
        fixed {
            storeFile file(System.getenv("GC_KEYSTORE") ?: "none")
            storePassword System.getenv("GC_KEY_PASSWORD")
            keyAlias "gridcraft"
            keyPassword System.getenv("GC_KEY_PASSWORD")
        }
    }
    buildTypes {
        debug { if (System.getenv("GC_KEYSTORE")) signingConfig signingConfigs.fixed }
    }
    // jniLibs/ is filled by `cargo ndk` (see .github/workflows/android.yml).
    packagingOptions { jniLibs { useLegacyPackaging true } }
}
